<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: true, step: 0 };
  }
  tick() {
    var self = this;
    clearTimeout(this._a); clearTimeout(this._b);
    this._a = setTimeout(function () { self.setState({ step: 1 }); }, 1500);
    this._b = setTimeout(function () { self.setState({ step: 2 }); }, 3300);
  }
  renderVals() {
    var self = this, st = this.state;
    if (!this._started) { this._started = true; setTimeout(function () { self.tick(); }, 0); }
    var words = ['Checking your records', 'Syncing your readings and medicines', 'Ready · works offline too'];
    return {
      show: st.show, status: words[st.step] || words[0],
      replay: function () { self.setState({ show: false }); setTimeout(function () { self.setState({ show: true, step: 0 }); self.tick(); }, 30); }
    };
  }
}
</script>
