<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,a{font:inherit;border:0;margin:0;cursor:pointer;text-decoration:none}
@keyframes markIn{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
@keyframes glow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}
@keyframes letterIn{0%{transform:translateY(40px) scale(.9);opacity:0;filter:blur(6px)}100%{transform:none;opacity:1;filter:blur(0)}}
@keyframes sheen{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(-10px,8px)}}
@keyframes load{0%{width:0}100%{width:100%}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.06)}30%{transform:scale(1)}}
/* MedSync Tide motion */
@keyframes msPageIn{0%{opacity:0;scale:.985;translate:0 10px}100%{opacity:1;scale:1;translate:0 0}}
@keyframes msUp{0%{opacity:0;translate:0 16px}100%{opacity:1;translate:0 0}}
@keyframes msCard{0%{opacity:0;translate:0 26px;scale:.97}100%{opacity:1;translate:0 0;scale:1}}
@keyframes msNav{0%{opacity:0;translate:0 40px}100%{opacity:1;translate:0 0}}
[data-screen]{animation:msPageIn .5s cubic-bezier(.16,1,.3,1) both}
[data-scroll]>*,[data-scroll]>sc-if>*{animation:msUp .55s cubic-bezier(.16,1,.3,1) both}
[data-scroll]>*:nth-child(1){animation-delay:.04s}[data-scroll]>*:nth-child(2){animation-delay:.08s}[data-scroll]>*:nth-child(3){animation-delay:.12s}[data-scroll]>*:nth-child(4){animation-delay:.16s}[data-scroll]>*:nth-child(5){animation-delay:.2s}[data-scroll]>*:nth-child(6){animation-delay:.24s}[data-scroll]>*:nth-child(7){animation-delay:.28s}[data-scroll]>*:nth-child(8){animation-delay:.32s}[data-scroll]>*:nth-child(n+9){animation-delay:.36s}
[data-cascade]>*{animation:msCard .6s cubic-bezier(.16,1,.3,1) both}
[data-cascade]>*:nth-child(1){animation-delay:.18s}[data-cascade]>*:nth-child(2){animation-delay:.28s}[data-cascade]>*:nth-child(3){animation-delay:.38s}[data-cascade]>*:nth-child(n+4){animation-delay:.48s}
[data-navwrap]{animation:msNav .6s cubic-bezier(.34,1.4,.64,1) .2s both}
button,a,[role=switch]{transition:scale .16s ease,filter .2s ease,background-color .25s ease,box-shadow .25s ease,color .2s ease}
button:active,a:active{scale:.96}
button:hover,a:hover{filter:brightness(1.04)}
input,textarea{transition:box-shadow .2s ease,background-color .2s ease}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div data-screen data-theme="dark" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #24314f; color: #ffffff; font-family: Figtree, sans-serif">
  <sc-if value="{{show}}" hint-placeholder-val="{{true}}">
  <!-- glow -->
  <span aria-hidden="true" style="position: absolute; left: 50%; top: 340px; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 999px; background: radial-gradient(circle, rgba(45,212,191,.28) 0%, rgba(45,212,191,0) 62%); animation: glow 3.2s ease-in-out infinite"></span>
  <span aria-hidden="true" style="position: absolute; right: -120px; bottom: -140px; width: 360px; height: 360px; border-radius: 999px; background: radial-gradient(circle, rgba(124,58,237,.22) 0%, rgba(124,58,237,0) 65%)"></span>
  <!-- Help stays reachable -->
  <a href="DHelp.dc.html" aria-label="Help, emergency" style="position: absolute; top: 58px; right: 20px; width: 44px; height: 44px; border-radius: 999px; background: #dc2626; color: #ffffff; display: grid; place-items: center; box-shadow: 0 6px 16px -6px rgba(220,38,38,.6); animation: rise .5s ease-out .2s both"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" style="stroke-width: 2" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg></a>

  <!-- wordmark -->
  <div style="position: absolute; left: 0; right: 0; top: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px">
    <span aria-label="MedSync" style="position: relative; font: 800 56px/60px Figtree, sans-serif; letter-spacing: -0.035em; overflow: hidden; padding: 0 6px">
      <span style="display: inline-block; color: #ffffff; animation: letterIn .7s cubic-bezier(.16,1,.3,1) 0.25s both">M</span><span style="display: inline-block; color: #ffffff; animation: letterIn .7s cubic-bezier(.16,1,.3,1) 0.34s both">e</span><span style="display: inline-block; color: #ffffff; animation: letterIn .7s cubic-bezier(.16,1,.3,1) 0.43s both">d</span><span style="display: inline-block; color: #2dd4bf; animation: letterIn .7s cubic-bezier(.16,1,.3,1) 0.52s both">S</span><span style="display: inline-block; color: #2dd4bf; animation: letterIn .7s cubic-bezier(.16,1,.3,1) 0.61s both">y</span><span style="display: inline-block; color: #2dd4bf; animation: letterIn .7s cubic-bezier(.16,1,.3,1) 0.70s both">n</span><span style="display: inline-block; color: #2dd4bf; animation: letterIn .7s cubic-bezier(.16,1,.3,1) 0.79s both">c</span>
      <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(100deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 70%); mix-blend-mode: overlay; transform: translateX(-120%); animation: sheen 1.4s ease-in-out 1.1s both"></span>
    </span>
    <span style="font: 500 17px Figtree, sans-serif; color: #e8ecf3; letter-spacing: .01em; animation: rise .6s ease-out 1.05s both">Your care, in sync.</span>
  </div>

  <!-- bottom -->
  <div style="position: absolute; left: 40px; right: 40px; bottom: 44px; display: flex; flex-direction: column; align-items: center; gap: 14px; animation: rise .6s ease-out 1.1s both">
    <span style="display: inline-flex; gap: 8px; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.08); color: #ffffff; font: 600 13px Figtree, sans-serif"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v4 M14 14h-4 M14 18h-4 M14 8h-4 M18 12h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h2 M18 22V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v18"/></svg>Kawempe Health Centre IV</span>
    <span style="width: 100%; height: 4px; border-radius: 999px; background: rgba(255,255,255,.12); overflow: hidden"><span style="display: block; height: 100%; border-radius: 999px; background: #2dd4bf; animation: load 2.4s cubic-bezier(.4,0,.2,1) 1.1s both"></span></span>
    <span style="font: 500 12px Figtree, sans-serif; color: #8f99b3">{{status}}</span>
    <a href="DSignIn.dc.html" style="width: 100%; height: 56px; border-radius: 999px; background: #2dd4bf; color: #1b2540; display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 17px Figtree, sans-serif; box-shadow: 0 12px 28px -10px rgba(45,212,191,.7)">Sign in<svg class="ic" width="20" height="20" viewBox="0 0 24 24" style="stroke-width: 2.2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a href="DSignUp.dc.html" style="font: 600 14px Figtree, sans-serif; color: #ffffff">New here? <span style="color: #5eead4">Create an account</span></a>
    <button type="button" onClick="{{replay}}" style="height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.08); color: #b4bccd; display: inline-flex; gap: 6px; align-items: center; font: 600 12px Figtree, sans-serif"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8 M3 3v5h5"/></svg>Replay</button>
    <span style="font: 500 11px Figtree, sans-serif; color: #6f7a96">Illustrative · prototype controls</span>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: true, step: 0 };
  }
  tick() {
    var self = this;
    clearTimeout(this._a); clearTimeout(this._b);
    this._a = setTimeout(function () { self.setState({ step: 1 }); }, 1500);
    this._b = setTimeout(function () { self.setState({ step: 2 }); }, 3300);
  }
  renderVals() {
    var self = this, st = this.state;
    if (!this._started) { this._started = true; setTimeout(function () { self.tick(); }, 0); }
    var words = ['Checking your records', 'Syncing your readings and medicines', 'Ready · works offline too'];
    return {
      show: st.show, status: words[st.step] || words[0],
      replay: function () { self.setState({ show: false }); setTimeout(function () { self.setState({ show: true, step: 0 }); self.tick(); }, 30); }
    };
  }
}
</script>
</body>
</html>
