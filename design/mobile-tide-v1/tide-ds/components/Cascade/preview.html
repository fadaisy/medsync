<!-- @dsCard group="Content" height=430 subtitle="The day as stacked cards: navy for done, lagoon for now, foam for next" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}
.wrap{padding:24px 20px;max-width:350px}
.c{display:flex;gap:12px;align-items:center;padding:16px 18px 48px;border-radius:28px 28px 0 0;margin-top:-32px;color:var(--on-band)}
.c:first-child{margin-top:0}
.c .t{flex:1;display:flex;flex-direction:column}
.c b{font:600 17px/22px var(--font-sans)}
.c small{font:500 14px/19px var(--font-sans);color:var(--on-band-2)}
.chk{width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.95);display:grid;place-items:center}
.i{width:36px;height:36px;border-radius:999px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.now{margin-top:-32px;border-radius:28px;padding:18px;background:var(--cascade-now);color:var(--accent-on);display:flex;flex-direction:column;gap:12px}
.now .ov{font:600 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase}
.now h3{margin:0;font:600 24px/30px var(--font-sans);letter-spacing:-.02em}
.row{display:flex;gap:8px}
.b{height:50px;border-radius:999px;border:0;font:600 16px var(--font-sans);flex:1}
.b1{background:var(--navy-900);color:#fff}
.b2{background:rgba(255,255,255,.55);color:var(--accent-on);flex:0 0 auto;padding:0 18px}
.next{margin-top:10px;display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:22px;background:var(--cascade-next);color:var(--navy-950)}
</style></head>
<body><div class="wrap">
  <div class="c" style="background:var(--cascade-1)"><span class="i"><svg class="ic" width="18" height="18" viewBox="0 0 24 24"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg></span><span class="t"><b>Morning medicine</b><small>07:12 · taken</small></span><span class="chk" style="color:var(--cascade-1)"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" style="stroke-width:3"><path d="M20 6 9 17l-5-5"/></svg></span></div>
  <div class="c" style="background:var(--cascade-2)"><span class="i"><svg class="ic" width="18" height="18" viewBox="0 0 24 24"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg></span><span class="t"><b>Blood pressure · 138/86</b><small>07:40 · above your target</small></span><span class="chk" style="color:var(--cascade-2)"><svg class="ic" width="15" height="15" viewBox="0 0 24 24" style="stroke-width:3"><path d="M20 6 9 17l-5-5"/></svg></span></div>
  <div class="c" style="background:var(--cascade-3)"><span class="i"><svg class="ic" width="18" height="18" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span><span class="t"><b>Your care team replied</b><small>09:15 · about this morning</small></span></div>
  <div class="now"><span class="ov">Now · 13:00</span><h3>Midday medicine</h3><div class="row"><button class="b b1">I took it</button><button class="b b2">Not yet</button></div></div>
  <div class="next"><span style="font:600 15px var(--font-sans);flex:1">Evening reading</span><span style="font:600 15px var(--font-sans)">20:00</span></div>
</div></body></html>
