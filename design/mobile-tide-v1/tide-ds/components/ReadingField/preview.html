<!-- @dsCard group="Input" height=190 subtitle="Big number boxes for a reading, with its unit" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}
.wrap{padding:24px 20px;max-width:350px;display:flex;flex-direction:column;gap:8px}
.lab{font:600 16px var(--font-sans)}
.row{display:flex;gap:8px;align-items:stretch}
.box{flex:1;display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-card)}
.box.on{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 5px var(--accent-tint)}
.box span{font:600 12px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.box input{border:0;padding:0;background:transparent;outline:none;width:100%;font:600 44px/48px var(--font-sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.sl{align-self:center;font:500 30px var(--font-sans);color:var(--ink-3)}
.unit{font:400 15px var(--font-sans);color:var(--ink-2)}
</style></head>
<body><div class="wrap">
  <span class="lab">Blood pressure</span>
  <div class="row">
    <label class="box on"><span>Top</span><input inputmode="numeric" value="138" aria-label="Top number"></label>
    <span class="sl">/</span>
    <label class="box"><span>Bottom</span><input inputmode="numeric" placeholder="--" aria-label="Bottom number"></label>
  </div>
  <span class="unit">mmHg · the two big numbers on your machine</span>
</div></body></html>
