<!-- @dsCard group="Actions" height=200 subtitle="Pill buttons: primary, secondary, soft, text" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}
.wrap{display:flex;flex-direction:column;gap:12px;padding:24px;max-width:340px}
.row{display:flex;gap:10px}
.b{height:52px;border-radius:999px;border:0;font:600 16px/20px var(--font-sans);padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.primary{background:var(--accent);color:var(--accent-on);box-shadow:var(--shadow-accent)}
.secondary{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.soft{background:var(--accent-tint);color:var(--accent-text)}
.text{background:transparent;color:var(--accent-text);padding:0 12px}
.off{background:var(--surface-sunken);color:var(--ink-3);cursor:not-allowed}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body><div class="wrap">
  <button class="b primary">Save reading</button>
  <div class="row"><button class="b secondary" style="flex:1">Not yet</button><button class="b soft" style="flex:1"><svg class="ic" width="18" height="18" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>Add</button></div>
  <div class="row"><button class="b off" style="flex:1" disabled>Confirm booking</button><button class="b text">Change</button></div>
</div></body></html>
