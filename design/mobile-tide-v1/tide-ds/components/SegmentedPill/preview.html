<!-- @dsCard group="Navigation" height=110 subtitle="Today / This week, with the round add button" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}
.wrap{display:flex;gap:8px;align-items:center;padding:28px 20px;max-width:360px}
.seg{flex:1;height:46px;border-radius:999px;border:0;font:600 16px/20px var(--font-sans);cursor:pointer}
.on{background:var(--accent);color:var(--accent-on);box-shadow:var(--shadow-accent)}
.off{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-card)}
.add{width:46px;height:46px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-on);display:grid;place-items:center;box-shadow:var(--shadow-accent)}
.ic{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
</style></head>
<body><div class="wrap" role="group" aria-label="Show">
  <button class="seg on" aria-pressed="true">Today</button>
  <button class="seg off" aria-pressed="false">This week</button>
  <button class="add" aria-label="Add"><svg class="ic" width="22" height="22" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
</div></body></html>
