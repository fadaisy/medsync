<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}
.wrap{display:flex;gap:16px;align-items:center;padding:28px 20px;flex-wrap:wrap}
.help{height:40px;padding:0 14px 0 11px;border-radius:999px;border:0;background:var(--emergency);color:var(--on-emergency);font:600 15px/20px var(--font-sans);display:inline-flex;gap:6px;align-items:center;box-shadow:var(--shadow-emergency)}
.now{height:56px;padding:0 26px 0 22px;border-radius:999px;border:0;background:var(--emergency);color:var(--on-emergency);font:600 17px/20px var(--font-sans);display:inline-flex;gap:8px;align-items:center;box-shadow:var(--shadow-emergency)}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body><div class="wrap">
  <button class="help" aria-label="Help, emergency"><svg class="ic" width="17" height="17" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Help</button>
  <button class="now"><svg class="ic" width="20" height="20" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Get help now</button>
</div></body></html>
